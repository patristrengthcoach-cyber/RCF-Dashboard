<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Readaptación de Lesiones · Racing Club Ferrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<style>
  html,body{margin:0;padding:0;background:#F7F5EF;}
  body{padding:18px 12px 40px;}
</style>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

.rcf-app{
  --navy:#101E3B; --navy2:#182A4D; --red:#C41230; --red-dark:#8C0C22;
  --green:#0B6B45; --green-dark:#084F39; --paper:#F7F5EF; --ink:#14181F;
  --gold:#B98A1D; --gold-bg:#FBF3DE; --line:rgba(16,30,59,.14); --muted:#5B6472; --thumb-bg:#E7E4DA;
  --amber:#B45F06; --amber-bg:#FCEBD5; --red-bg:#FBE1E4;
  font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--paper);
  border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(16,30,59,.15);
  max-width:1180px; margin:0 auto;
}
.rcf-app *{box-sizing:border-box;}
.rcf-app h1,.rcf-app h2,.rcf-app h3,.rcf-app .disp{font-family:'Oswald',Arial,sans-serif; letter-spacing:.02em;}
.rcf-app .mono{font-family:'IBM Plex Mono',monospace;}
.rcf-app :focus-visible{outline:3px solid var(--red); outline-offset:2px;}
.rcf-app button{font-family:inherit;}
.rcf-app input,.rcf-app select,.rcf-app textarea{font-family:'Inter',sans-serif;}

/* ===== HEADER ===== */
.rcf-header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%); color:#fff; padding:20px 26px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.rcf-crest{height:76px; width:auto; max-width:70px; object-fit:contain; flex:0 0 auto;}
.rcf-htext{flex:1 1 260px; min-width:0;}
.rcf-htext h1{font-size:22px; margin:0 0 2px; font-weight:600; text-transform:uppercase; line-height:1.15;}
.rcf-htext p{margin:0; font-size:11.5px; color:#c7cfe0; font-family:'IBM Plex Mono',monospace; letter-spacing:.04em; text-transform:uppercase;}
.rcf-hactions{display:flex; gap:8px; flex-wrap:wrap;}
.rcf-btn{border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.06); color:#fff; font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; padding:9px 14px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.15s;}
.rcf-btn:hover{background:rgba(255,255,255,.16);}
.rcf-btn.primary{background:var(--red); border-color:var(--red);}
.rcf-btn.primary:hover{background:var(--red-dark);}
.rcf-btn.ghost{background:none;}

/* ===== TABS ===== */
.rcf-globalfilter{display:flex; align-items:center; gap:10px; padding:11px 26px; background:#EFECE1; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.rcf-globalfilter .gf-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--navy); font-weight:600;}
.rcf-globalfilter select{font-size:13px; padding:7px 10px; border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); min-width:260px; max-width:100%;}
.rcf-globalfilter select:focus{border-color:var(--navy);}
.rcf-globalfilter .gf-hint{font-size:11px; color:var(--muted); margin-left:auto;}
@media (max-width:640px){.rcf-globalfilter{padding:11px 16px;} .rcf-globalfilter .gf-hint{margin-left:0; flex-basis:100%;}}

.rcf-tabs{display:flex; gap:6px; padding:16px 26px 0; flex-wrap:wrap; border-bottom:1px solid var(--line);}
.rcf-tab{background:none; border:none; border-bottom:3px solid transparent; padding:10px 6px 12px; margin-right:14px; font-family:'Oswald',sans-serif; font-size:14px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); cursor:pointer;}
.rcf-tab:hover{color:var(--ink);}
.rcf-tab.active{color:var(--navy); border-bottom-color:var(--red);}
.rcf-tab .n{display:inline-block; background:var(--line); color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:10px; border-radius:20px; padding:1px 7px; margin-left:6px; vertical-align:2px;}
.rcf-tab.active .n{background:var(--navy); color:#fff;}

/* ===== SESSION DATA PANEL ===== */
.rcf-datapanel{padding:18px 26px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px;}
.rcf-field label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); display:block; margin-bottom:5px;}
.rcf-field input,.rcf-field select{width:100%; font-size:13.5px; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);}
.rcf-field input:focus,.rcf-field select:focus{border-color:var(--navy);}
.rcf-field.wide{grid-column:1 / -1;}
.rcf-field textarea{width:100%; font-size:13.5px; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; resize:vertical; min-height:44px; font-family:'Inter',sans-serif;}

/* ===== FASE SELECTOR (RTP) ===== */
.rcf-fases{display:flex; gap:8px; padding:16px 26px 6px; flex-wrap:wrap;}
.rcf-fase{flex:1 1 130px; min-width:120px; background:#fff; border:2px solid var(--line); border-radius:10px; padding:9px 11px; cursor:pointer; text-align:left; transition:.15s;}
.rcf-fase:hover{border-color:#c7cfd9;}
.rcf-fase.active{border-color:var(--navy); background:var(--navy);}
.rcf-fase.active.warn{border-color:var(--gold); background:var(--gold);}
.rcf-fase .num{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:.05em;}
.rcf-fase.active .num{color:#c7cfe0;}
.rcf-fase .name{font-family:'Oswald',sans-serif; font-size:13.5px; font-weight:600; color:var(--ink); text-transform:uppercase; line-height:1.2;}
.rcf-fase.active .name{color:#fff;}

.rcf-catnote{margin:4px 26px 4px; padding:10px 14px; border-radius:8px; font-size:12.5px; line-height:1.5; border-left:4px solid var(--navy); background:#fff;}
.rcf-catnote.warn{border-left-color:var(--gold); background:var(--gold-bg);}
.rcf-catnote b{color:var(--navy);}
.rcf-catnote.warn b{color:#8a6710;}

/* ===== BLOQUE / TIPO PILLS ===== */
.rcf-filters{display:flex; gap:22px; padding:14px 26px; flex-wrap:wrap; align-items:flex-start; border-bottom:1px solid var(--line);}
.rcf-filtergroup .flabel{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; display:block;}
.rcf-pills{display:flex; gap:6px; flex-wrap:wrap;}
.rcf-pill{background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; color:var(--ink); white-space:nowrap;}
.rcf-pill.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.rcf-pill[data-tipoloc="gym"].active{background:var(--navy); border-color:var(--navy);}
.rcf-pill[data-tipoloc="gym_campo"].active{background:var(--green); border-color:var(--green);}
.rcf-pill[data-tipoloc="campo"].active{background:var(--red); border-color:var(--red);}
.rcf-pill small{display:block; font-weight:400; font-size:10px; opacity:.85; margin-top:1px;}

/* ===== TIMELINE ===== */
.rcf-timeline{margin:16px 26px 4px;}
.rcf-tl-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px;}
.rcf-tl-bar{display:flex; height:34px; border-radius:8px; overflow:hidden; border:1px solid var(--line);}
.rcf-tl-seg{display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Oswald',sans-serif; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; gap:4px;}
.rcf-tl-seg input{width:34px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.4); border-radius:4px; color:#fff; font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center; padding:1px 2px;}
.rcf-tl-seg span.min{font-family:'IBM Plex Mono',monospace; font-weight:500; opacity:.85;}

/* ===== SECTIONS / CARDS ===== */
.rcf-section{padding:18px 26px;}
.rcf-section h2{font-size:15px; margin:0 0 3px; text-transform:uppercase; display:flex; align-items:center; gap:8px;}
.rcf-sectitle-input{font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; border:1px dashed transparent; background:transparent; color:var(--ink); padding:2px 5px; border-radius:5px; flex:1; min-width:140px;}
.rcf-sectitle-input:hover{border-color:var(--line);}
.rcf-sectitle-input:focus{border-color:var(--navy); background:#fff;}
.rcf-section .sdesc{font-size:12px; color:var(--muted); margin:0 0 12px;}
.rcf-dot{width:11px; height:11px; border-radius:50%; display:inline-block;}
.rcf-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px;}
.rcf-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 13px; position:relative; display:flex; flex-direction:column;}

.rcf-thumb{display:block; width:calc(100% + 26px); aspect-ratio:16/9; margin:-12px -13px 9px; border-radius:9px 9px 0 0; overflow:hidden; position:relative; background:var(--thumb-bg); text-decoration:none;}
.rcf-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.rcf-thumb .playdot{position:absolute; bottom:6px; right:6px; background:rgba(16,30,59,.85); color:#fff; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px;}
.rcf-thumb.empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--muted);}
.rcf-thumb.empty .picn{font-size:19px; opacity:.45;}
.rcf-thumb.empty .pict{font-size:10.5px; font-weight:600;}

.rcf-badges{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:6px; align-items:center;}
.rcf-card .badge{font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:20px; display:inline-block;}
.rcf-card .badge.mat{background:#E4E9F2; color:var(--navy);}
.rcf-card .badge.fase{background:var(--gold-bg); color:#8a6710;}
.rcf-card .badge.added{background:#F3E7C6; color:#8a6710;}
.rcf-card .ename{font-size:13.5px; font-weight:600; line-height:1.35; margin-bottom:6px;}
.rcf-card .dosegrid{display:grid; grid-template-columns:1fr 1fr; gap:4px 8px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink); background:var(--paper); border-radius:6px; padding:6px 8px; margin-bottom:7px;}
.rcf-card .dosegrid span.k{color:var(--muted); display:block; font-size:9px; text-transform:uppercase;}
.rcf-card .ev{font-size:11px; color:var(--green-dark); line-height:1.4; margin-bottom:7px; font-style:italic;}
.rcf-card .vidrow{display:flex; align-items:center; justify-content:space-between; gap:6px; border-top:1px dashed var(--line); padding-top:7px; margin-top:auto;}
.rcf-card .vidstatus{font-size:11px; color:var(--muted); font-weight:600;}
.rcf-editbtn{background:none; border:1px solid var(--line); border-radius:6px; width:24px; height:24px; cursor:pointer; font-size:12px; color:var(--muted); flex:0 0 auto;}
.rcf-editbtn:hover{border-color:var(--navy); color:var(--navy);}
.rcf-editform{display:none; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
.rcf-editform.open{display:block;}
.rcf-editform label{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); display:block; margin-bottom:2px;}
.rcf-editform input{width:100%; font-size:11.5px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; margin-bottom:5px; font-family:'Inter',sans-serif;}
.rcf-editform .erow2{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.rcf-editform .erow{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.rcf-editform button{font-size:11px; font-weight:600; padding:5px 10px; border-radius:6px; border:none; cursor:pointer;}
.rcf-editform .save{background:var(--navy); color:#fff;}
.rcf-editform .clear{background:#eee; color:var(--ink);}
.rcf-editform .hidebtn{background:none; color:var(--red); text-decoration:underline; padding:5px 2px;}
.rcf-saveflag{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--green-dark); opacity:0; transition:opacity .25s; margin-left:auto;}
.rcf-saveflag.show{opacity:1;}

.rcf-addtosession{width:100%; margin-top:auto; background:var(--navy); color:#fff; border:none; border-radius:6px; padding:8px; font-size:11px; font-weight:600; cursor:pointer; font-family:'Oswald',sans-serif; letter-spacing:.02em; text-transform:uppercase;}
.rcf-addtosession:hover{background:var(--navy2);}
.rcf-addtosession.added{background:var(--green); cursor:default;}
.rcf-addcard{background:transparent; border:1.5px dashed var(--line); border-radius:10px; padding:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); font-size:12.5px; font-weight:600; min-height:70px;}
.rcf-addcard:hover{border-color:var(--navy); color:var(--navy);}
.rcf-morebtn{display:block; width:100%; background:none; border:1px dashed var(--line); border-radius:10px; padding:9px; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer; text-align:center; margin-top:10px;}
.rcf-morebtn:hover{border-color:var(--navy); color:var(--navy);}
.rcf-grid.extras{display:none; margin-top:10px;}
.rcf-grid.extras.open{display:grid;}
.rcf-card.extra{background:#FBFAF6; border-style:dashed;}

.rcf-hint{font-size:11px; color:var(--muted); margin:2px 26px 18px;}
.rcf-storagenote{display:flex; align-items:flex-start; gap:7px; font-size:11px; color:var(--muted); margin:4px 26px 20px; max-width:78ch;}
.rcf-storagenote svg{width:13px; height:13px; flex:none; margin-top:1px; opacity:.7;}

/* ===== FICHA TABLE ===== */
.rcf-fichatable{width:100%; border-collapse:collapse; margin-bottom:8px; font-size:12.5px;}
.rcf-fichatable th{font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); text-align:left; padding:6px 7px; border-bottom:1.5px solid var(--line); white-space:nowrap;}
.rcf-fichatable td{padding:5px 7px; border-bottom:1px solid var(--line); vertical-align:middle;}
.rcf-fichatable input,.rcf-fichatable textarea{width:100%; border:1px solid transparent; border-radius:5px; padding:5px 6px; font-size:12px; font-family:'Inter',sans-serif; background:transparent;}
.rcf-fichatable input:hover,.rcf-fichatable textarea:hover{border-color:var(--line);}
.rcf-fichatable input:focus,.rcf-fichatable textarea:focus{border-color:var(--navy); background:#fff;}
.rcf-fichatable tr:hover{background:#FBFAF6;}
.rcf-fichatable .ename-cell{min-width:170px; font-weight:600;}
.rcf-fichatable .rmbtn{background:none; border:none; color:var(--red); cursor:pointer; font-size:14px; padding:2px 5px;}
.rcf-fichatable .idcell{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted);}
.rcf-emptyrow td{color:var(--muted); font-style:italic; font-size:12px; padding:12px 8px;}
.rcf-blockmin{display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-bottom:8px;}
.rcf-blockmin input{width:48px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; text-align:center;}

/* ===== SUMMARY / CARGA PANEL ===== */
.rcf-summary{background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:16px 18px; margin:6px 0 18px;}
.rcf-summary-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:12px;}
.rcf-stat .slabel{font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:3px;}
.rcf-stat .sval{font-family:'Oswald',sans-serif; font-size:24px; font-weight:600; color:var(--navy);}
.rcf-stat .sval.big-red{color:var(--red);}
.rcf-stat input,.rcf-stat select{width:100%; font-size:16px; padding:6px 8px; border:1.5px solid var(--line); border-radius:7px; font-family:'IBM Plex Mono',monospace;}

.rcf-badge-risk{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; padding:3px 10px; border-radius:20px; text-transform:uppercase;}
.rcf-badge-risk.ok{background:#DCEEE3; color:var(--green-dark);}
.rcf-badge-risk.warn{background:var(--amber-bg); color:var(--amber);}
.rcf-badge-risk.risk{background:var(--red-bg); color:var(--red-dark);}
.rcf-badge-risk.na{background:#EAEAEA; color:var(--muted);}

/* ===== REGISTRO / CARGA TAB ===== */
.rcf-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin:8px 0 16px;}
.rcf-legend .lg{display:flex; align-items:center; gap:5px;}
.rcf-legend .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
.rcf-daybars{display:flex; align-items:flex-end; gap:6px; height:90px; margin:10px 0 4px; border-bottom:1.5px solid var(--line); padding-bottom:2px;}
.rcf-daybar{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px;}
.rcf-daybar .bar{width:100%; max-width:34px; background:var(--navy); border-radius:4px 4px 0 0; min-height:2px;}
.rcf-daybar .dlabel{font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--muted);}
.rcf-regtable{width:100%; border-collapse:collapse; font-size:12px; margin-top:14px;}
.rcf-regtable th{font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); text-align:left; padding:6px 8px; border-bottom:1.5px solid var(--line);}
.rcf-regtable td{padding:6px 8px; border-bottom:1px solid var(--line);}
.rcf-regtable .rmbtn{background:none; border:none; color:var(--red); cursor:pointer; font-size:13px;}
.rcf-seg-checklist{background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px;}
.rcf-seg-chklist{display:flex; flex-wrap:wrap; gap:6px 16px;}
.rcf-seg-chk{display:flex; align-items:center; gap:5px; font-size:12.5px; cursor:pointer;}
.rcf-seg-chk .mono{color:var(--muted); font-size:10px;}
.rcf-seg-chk input{accent-color:var(--navy);}

/* ===== CALENDARIO SEMANAL ===== */
.rcf-citas-grid{display:grid; grid-template-columns:repeat(7,minmax(150px,1fr)); gap:8px;}
.rcf-cita-day{background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:9px; display:flex; flex-direction:column; min-height:130px;}
.rcf-cita-day.today{border-color:var(--red); box-shadow:0 0 0 1px var(--red) inset;}
.rcf-cita-daytitle{font-family:'Oswald',sans-serif; font-size:12px; font-weight:600; text-transform:uppercase; display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; color:var(--navy); border-bottom:1px solid var(--line); padding-bottom:6px;}
.rcf-cita-daytitle .mono{font-size:10px; color:var(--muted); font-weight:400;}
.rcf-cita-list{flex:1; display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
.rcf-cita-empty{font-size:11px; color:var(--muted); font-style:italic; padding:6px 0;}
.rcf-cita-item{background:var(--paper); border:1px solid var(--line); border-radius:7px; padding:6px 7px; font-size:11.5px; display:flex; gap:6px; align-items:flex-start;}
.rcf-cita-hora{font-weight:700; color:var(--navy); font-size:12px; white-space:nowrap; padding-top:1px;}
.rcf-cita-info{flex:1; min-width:0; line-height:1.4;}
.rcf-cita-actions{display:flex; flex-direction:column; gap:2px;}
@media (max-width:900px){.rcf-citas-grid{grid-template-columns:repeat(7,minmax(130px,1fr)); overflow-x:auto;}}
@media print{.rcf-citas-grid{grid-template-columns:repeat(7,1fr);}}

/* ===== MEMORIA DE SESIONES ===== */
.rcf-memoria-playerlist{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 16px;}
.rcf-memoria-playercard{background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer; text-align:left; min-width:150px;}
.rcf-memoria-playercard:hover{border-color:#c7cfd9;}
.rcf-memoria-playercard.active{border-color:var(--navy); background:var(--navy);}
.rcf-memoria-playercard .mpc-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; color:var(--ink);}
.rcf-memoria-playercard.active .mpc-name{color:#fff;}
.rcf-memoria-playercard .mpc-meta{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); margin-top:2px;}
.rcf-memoria-playercard.active .mpc-meta{color:#c7cfe0;}
.rcf-memoria-playercard .mpc-count{font-size:10.5px; color:var(--muted); margin-top:3px;}
.rcf-memoria-playercard.active .mpc-count{color:#c7cfe0;}

@media (max-width:640px){
  .rcf-header{padding:16px 16px;}
  .rcf-tabs,.rcf-cats,.rcf-fases,.rcf-filters,.rcf-section,.rcf-timeline,.rcf-datapanel{padding-left:16px; padding-right:16px;}
  .rcf-catnote,.rcf-hint,.rcf-storagenote{margin-left:16px; margin-right:16px;}
  .rcf-fichatable{display:block; overflow-x:auto;}
}

/* ===== PRINT ===== */
@page { size: A4 landscape; margin: 10mm; }
@media print{
  body *{visibility:hidden;}
  .rcf-app, .rcf-app *{visibility:visible;}
  .rcf-app{box-shadow:none; max-width:100%; border-radius:0;}
  .no-print{display:none !important;}
  .rcf-header{background:var(--navy) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .rcf-tl-seg{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .rcf-card{break-inside:avoid;}
  .rcf-section{break-inside:avoid; padding:10px 20px;}
  .print-only{display:block !important;}
}
.print-only{display:none;}

  function uid(){ return 'x' + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }

  const STORAGE_MODE = (typeof window.storage !== 'undefined') ? 'cloud' : 'local';

    if(STORAGE_MODE === 'cloud'){
      try{ const r = await window.storage.get(key, !!shared); return r ? r.value : null; }
      catch(e){ return null; }
    } else {
      try{ return localStorage.getItem(key); } catch(e){ return null; }
    }
  }
  async function stSet(key, value, shared){
    if(STORAGE_MODE === 'cloud'){
      try{ await window.storage.set(key, value, !!shared); }

    } else {
      try{ localStorage.setItem(key, value); }

  function normalizeHeader(s){
    return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  }
  const SHEET_FIELD_MAP = [
    {key:'jugId', aliases:['id de jugador','id jugador']},
    {key:'nombre', aliases:['nombre y apellido','nombre']},
    {key:'fechaLesion', aliases:['fecha lesion']},
    {key:'temporada', aliases:['temporada']},
    {key:'diagnostico', aliases:['diagnostico medico readt fisio','diagnostico']},
    {key:'localizacion', aliases:['localizacion']},
    {key:'lateralidad', aliases:['lateralidad']},
    {key:'tipologia', aliases:['tipologia']},
    {key:'mecanismo', aliases:['mecanismo de lesion','mecanismo']},
    {key:'reincidencia', aliases:['reicidiva','reincidencia']},
    {key:'contexto', aliases:['contexto']},
    {key:'severidad', aliases:['severidad']},
    {key:'categoria', aliases:['equipo']},
    {key:'pronostico', aliases:['pronostico']},
    {key:'posicion', aliases:['posicion']},
    {key:'superficie', aliases:['superficie']},
    {key:'comoSeProdujo', aliases:['como se produjo la lesion']}
  ];
  function buildSheetHeaderMap(headerRow){
    const map = {};
    headerRow.forEach((h, idx)=>{
      const norm = normalizeHeader(h);
      if(!norm) return;
      const found = SHEET_FIELD_MAP.find(f => f.aliases.some(a => norm===a || norm.indexOf(a)!==-1));
      if(found) map[idx] = found.key;
    });
    return map;
  }
  function parseSheetDate(raw){
    if(!raw) return '';
    const m = String(raw).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(!m) return '';
    return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  }
  function parseCSV(text){
    const rows = []; let row = [], field = '', inQuotes = false;
    for(let i=0;i<text.length;i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
        else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else if(c === '\r'){ /* ignorado, \n cierra la fila */ }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }
  function timeAgo(date){
    if(!date) return 'nunca sincronizado';
    const diffMin = Math.round((Date.now()-date.getTime())/60000);
    if(diffMin < 1) return 'hace un momento';
    if(diffMin === 1) return 'hace 1 minuto';
    if(diffMin < 60) return 'hace '+diffMin+' minutos';
    return 'hace '+Math.round(diffMin/60)+' h';
  }

    if(!rec.jugId && !rec.nombre) return null;
    const existingIdx = lesionados.findIndex(l => rec.jugId ? l.jugId===rec.jugId : l.nombre===rec.nombre);
    if(existingIdx !== -1){
      lesionados[existingIdx] = Object.assign({}, lesionados[existingIdx], rec);
      return 'updated';
    }
    const nuevo = nuevoLesionado();
    Object.assign(nuevo, rec);
    nuevo.activo = true;
    lesionados.push(nuevo);
    if(segSelectedIds) segSelectedIds.add(nuevo.id);
    return 'added';
  }
  async function fetchCsvFromUrl(url){
    const res = await fetch(url, {cache:'no-store'});
    const text = await res.text();
    if(!res.ok || /^\s*<!DOCTYPE|<html/i.test(text)){
      throw new Error('respuesta no es CSV');
    }
    return text;
  }
  async function syncFromSheet(manual){
    if(!sheetSyncUrl) return;
    sheetSyncStatus = 'loading';
    if(manual) render();
    const usingDefault = sheetSyncUrl === RCF_SHEET_DEFAULT_URLS[0];
    const candidates = usingDefault ? RCF_SHEET_DEFAULT_URLS : [sheetSyncUrl];
    try{
      let text = null;
      for(const url of candidates){
        try{ text = await fetchCsvFromUrl(url); break; }
        catch(e){ /* probar el siguiente candidato */ }
      }
      if(text === null){
        throw new Error('No se ha podido leer la hoja directamente. Comprueba que siga compartida como "Cualquiera con el enlace" (con permiso de Lector), o pega aquí el enlace publicado como respaldo (Archivo → Compartir → Publicar en la web → formato CSV).');
      }
      const rows = parseCSV(text).filter(r => r.some(c=>String(c||'').trim()!==''));
      if(!rows.length) throw new Error('El archivo está vacío.');
      const headerMap = buildSheetHeaderMap(rows[0]);
      if(Object.keys(headerMap).length < 3) throw new Error('No se han reconocido las columnas esperadas (ID de jugador, nombre, fecha de lesión…).');
      let added = 0, updated = 0;
      rows.slice(1).forEach(r=>{
        if(!r.some(c=>String(c||'').trim()!=='')) return;
        const rec = {};
        Object.keys(headerMap).forEach(idxStr=>{
          const idx = Number(idxStr); const key = headerMap[idx];
          let val = String(r[idx]||'').trim();
          if(key==='fechaLesion') val = parseSheetDate(val);
          if(val) rec[key] = val;
        });
        const result = mergeLesionadoRecord(rec);
        if(result === 'added') added++; else if(result === 'updated') updated++;
      });
      saveLesionados();
      lastSyncAt = new Date();
      sheetSyncStatus = 'ok';
      sheetSyncMessage = (added || updated) ? ('Sincronizado: '+added+' nuevo(s), '+updated+' actualizado(s).') : 'Sincronizado, sin cambios nuevos.';
    } catch(e){
      sheetSyncStatus = 'error';
      sheetSyncMessage = (e && e.message) || 'Error al sincronizar.';
    }
    render();
  }

  // ================= FIREBASE EN TIEMPO REAL =================
  function parseFirebaseConfig(text){
    const cfg = {};
    ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].forEach(k=>{
      const re = new RegExp(k+'\\s*:\\s*["\']([^"\']+)["\']');
      const m = String(text||'').match(re);
      if(m) cfg[k] = m[1];
    });
    return cfg;
  }
  function normalizeFirestoreRow(data){
    const rec = {};
    SHEET_FIELD_MAP.forEach(f=>{
      const v = data[f.key];
      if(v!==undefined && v!==null && String(v).trim()!=='') rec[f.key] = String(v).trim();
    });
    return rec;
  }
  function disconnectFirebase(){
    if(fbUnsubscribe){ try{ fbUnsubscribe(); }catch(e){} fbUnsubscribe = null; }
    fbSyncStatus = ''; fbSyncMessage = '';
  }
  function connectFirebase(){
    if(typeof firebase === 'undefined'){
      fbSyncStatus = 'error';
      fbSyncMessage = 'No se pudo cargar el SDK de Firebase (sin conexión a internet). Vuelve a intentarlo con conexión.';
      render(); return;
    }
    const cfg = parseFirebaseConfig(firebaseConfigStr);
    if(!cfg.apiKey || !cfg.projectId){
      fbSyncStatus = 'error';
      fbSyncMessage = 'Pega el objeto de configuración completo de Firebase (apiKey, projectId…), tal como te lo da la consola de Firebase.';
      render(); return;
    }
    disconnectFirebase();
    fbSyncStatus = 'connecting';
    render();
    try{
      fbAppRef = firebase.apps && firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(cfg);
      const db = firebase.firestore(fbAppRef);
      fbUnsubscribe = db.collection(firebaseCollection || 'lesionados_rcf').onSnapshot(
        snapshot=>{
          let added = 0, updated = 0;
          snapshot.docChanges().forEach(change=>{
            if(change.type === 'removed') return; // no se elimina automáticamente al seguimiento
            const rec = normalizeFirestoreRow(change.doc.data() || {});
            const result = mergeLesionadoRecord(rec);
            if(result === 'added') added++; else if(result === 'updated') updated++;
          });
          if(added || updated) saveLesionados();
          fbLastEventAt = new Date();
          fbSyncStatus = 'ok';
          fbSyncMessage = 'Conectado en tiempo real' + ((added||updated) ? (' · '+added+' nuevo(s), '+updated+' actualizado(s) ahora mismo.') : '.');
          render();
        },
        err=>{
          fbSyncStatus = 'error';
          fbSyncMessage = 'Error de Firebase: ' + ((err && err.message) || err);
          render();
        }
      );
    } catch(e){
      fbSyncStatus = 'error';
      fbSyncMessage = 'No se pudo conectar: ' + ((e && e.message) || e);
      render();
    }
  }

  function resizeImageToDataURL(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = reject;
        img.onload = ()=>{
          let w = img.width, h = img.height;
          const scale = Math.min(1, (maxDim||900) / Math.max(w,h));
          w = Math.round(w*scale); h = Math.round(h*scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality||0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function computeTestDiff(resultado, referencia){
    const r = parseFloat(String(resultado).replace(',','.'));
    const b = parseFloat(String(referencia).replace(',','.'));
    if(isNaN(r) || isNaN(b) || b===0) return null;
    return (r-b)/b*100;
  }
  function interpretTestDiff(diff){
    if(diff===null) return '—';
    return Math.abs(diff)>=15
      ? '<span style="color:var(--red-dark);font-weight:600;">⚠ Asimetría relevante</span>'
      : '<span style="color:var(--green-dark);">Dentro de rango</span>';
  }

  // ================= REGISTRO Y CARGA (ACWR / monotonía / strain) =================
  function daysBetween(a,b){ return Math.round((a-b)/86400000); }
  function computeLoadStats(records){
    const today = new Date(); today.setHours(0,0,0,0);
    const byDate = {};
    records.forEach(r=>{
      byDate[r.fecha] = (byDate[r.fecha]||0) + Number(r.carga||0);
    });
    const daily7 = [];
    for(let i=6;i>=0;i--){
      const d = new Date(today); d.setDate(d.getDate()-i);
      const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      daily7.push({date:iso, label:['L','M','X','J','V','S','D'][ (d.getDay()+6)%7 ], carga: byDate[iso]||0});
    }
    const acute7 = daily7.reduce((s,d)=>s+d.carga,0);
    let chronic28sum = 0;
    records.forEach(r=>{
      const rd = new Date(r.fecha+'T00:00:00');
      const diff = daysBetween(today, rd);
      if(diff>=0 && diff<28) chronic28sum += Number(r.carga||0);
    });
    const chronic = records.length ? (chronic28sum/4) : 0;
    const acwr = chronic>0 ? (acute7/chronic) : null;
    const mean7 = acute7/7;
    const variance = daily7.reduce((s,d)=>s+Math.pow(d.carga-mean7,2),0)/7;
    const sd = Math.sqrt(variance);
    const monotony = sd>0 ? (mean7/sd) : null;
    const strain = monotony!==null ? acute7*monotony : null;
    return {daily7, acute7, chronic, acwr, monotony, strain};
  }

    const stats = computeLoadStats(records);

    const rows = records.length ? records.map(r=>

    return '<div class="rcf-section">' + selHtml

  const TABS = [
    {id:'banco', label:'Diseño de sesión'},
    {id:'ficha', label:'Ficha de sesión'},
    {id:'citas', label:'Calendario semanal'},

  function render(){
    document.getElementById('globalFilterBar').innerHTML = renderGlobalFilterBar();

      '<button class="rcf-tab'+(t.id===state.activeTab?' active':'')+'" data-tab="'+t.id+'">'+t.label+'</button>'
    ).join('');

    const showContext = state.activeTab !== 'seguimiento' && state.activeTab !== 'citas' && state.activeTab !== 'memoria';
    let body = showContext ? renderContextPanel() : '';
    if(state.activeTab === 'banco'){
      body += sectionsVisible(state.tipoloc).map(renderBankSection).join('');
    } else if(state.activeTab === 'ficha'){
      body += renderFichaTab();
    } else if(state.activeTab === 'citas'){
      body += renderCitasTab();
    } else if(state.activeTab === 'registro'){
      body += renderRegistroTab();
    } else if(state.activeTab === 'memoria'){
      body += renderMemoriaTab();
    } else {
      body += renderSeguimientoTab();
    }
    document.getElementById('viewContainer').innerHTML = body;

    if(showContext){
      document.getElementById('faseSelector').innerHTML = FASES.map(f =>
        '<button class="rcf-fase'+(f.id===Number(state.fase)?' active':'')+'" data-fase="'+f.id+'">'
        + '<div class="num">FASE '+f.id+'</div><div class="name">'+f.label+'</div></button>'
      ).join('');
      document.getElementById('tipolocSelector').innerHTML = TIPOLOC.map(t =>
        '<button class="rcf-pill'+(t.id===state.tipoloc?' active':'')+'" data-tipoloc="'+t.id+'">'+t.label+'<small>'+t.sub+'</small></button>'
      ).join('');
    }

    const modeNote = STORAGE_MODE==='cloud'
      ? 'Los cambios se guardan compartidos: todo el cuerpo técnico que abra este panel verá el mismo diseño de sesión, seguimiento y registro de carga.'
      : 'Modo navegador: los cambios se guardan en este dispositivo (localStorage). Para compartirlos entre todo el cuerpo técnico, aloja este archivo detrás de un backend compartido o ábrelo dentro de Claude.';
    document.getElementById('storageNote').textContent = modeNote;

    attachHandlers();
  }

  function recomputeSummary(){
    const dur = totalDuracion();
    const carga = cargaSesion();
    const totalEl = document.getElementById('totalDuracionVal');
    if(totalEl) totalEl.textContent = dur + "'";
    const cargaEl = document.getElementById('cargaSesionVal');
    if(cargaEl) cargaEl.textContent = carga===null ? '—' : fmtNum(carga);
    const tlTotal = document.getElementById('tlTotal');
    if(tlTotal) tlTotal.textContent = dur;
    sectionsVisible(state.tipoloc).forEach(s=>{
      const seg = document.getElementById('tlseg-'+s);
      if(seg) seg.style.flex = (Number(state.blockMin[s])||1);
      const min = document.getElementById('tlmin-'+s);
      if(min) min.textContent = state.blockMin[s] + "'";
    });
  }

  // ================= HANDLERS (clic) — se reenganchan tras cada render() =================
  function attachHandlers(){
    const gJugSel = document.getElementById('globalJugadorSelect');
    if(gJugSel) gJugSel.onchange = ()=>{
      state.jugId = gJugSel.value;
      const rec = lesionados.find(l=>l.jugId===state.jugId);
      state.jugNombre = rec ? rec.nombre : '';
      state.jugCat = rec ? rec.categoria : '';
      state.regSesSel = '';
      saveDraft(); render();
    };
    const btnClearGF = document.getElementById('btnClearGlobalFilter');
    if(btnClearGF) btnClearGF.onclick = ()=>{
      state.jugId=''; state.jugNombre=''; state.jugCat=''; state.regSesSel='';
      saveDraft(); render();
    };
    document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{ state.activeTab=el.dataset.tab; render(); });
    document.querySelectorAll('[data-fase]').forEach(el=>el.onclick=()=>{ state.fase=Number(el.dataset.fase); saveDraft(); render(); });
    document.querySelectorAll('[data-tipoloc]').forEach(el=>el.onclick=()=>{ state.tipoloc=el.dataset.tipoloc; saveDraft(); render(); });

    document.querySelectorAll('[data-editex]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.editex;
      if(openEdits.has(id)) openEdits.delete(id); else openEdits.add(id);
      render();
    });
    document.querySelectorAll('[data-savex]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.savex;
      const get=(p)=>{ const e=document.getElementById(p+'-'+id); return e ? e.value.trim() : ''; };
      const data = {n:get('name')||'(sin nombre)', series:get('series'), reps:get('reps'), carga:get('carga'), rpe:get('rpe'), descanso:get('descanso'), note:get('note'), yt:get('yt')};
      if(String(id).indexOf('cu_')===0){
        Object.keys(bankCustoms).forEach(sec=>{
          bankCustoms[sec] = (bankCustoms[sec]||[]).map(c=> c.id===id ? Object.assign({}, c, data) : c);
        });
      } else {
        bankOverrides[id] = Object.assign({}, bankOverrides[id]||{}, data);
      }
      openEdits.delete(id);
      saveBanco(); render();
    });
    document.querySelectorAll('[data-imgupload]').forEach(el=>el.onchange=async ()=>{
      const id=el.dataset.imgupload, section=el.dataset.section;
      const file = el.files && el.files[0];
      if(!file) return;
      let dataUrl;
      try{ dataUrl = await resizeImageToDataURL(file, 900, 0.82); }
      catch(e){ alert('No se pudo procesar la imagen.'); return; }
      if(String(id).indexOf('cu_')===0){
        bankCustoms[section] = (bankCustoms[section]||[]).map(c=> c.id===id ? Object.assign({}, c, {img:dataUrl}) : c);
      } else {
        bankOverrides[id] = Object.assign({}, bankOverrides[id]||{}, {img:dataUrl});
      }
      openEdits.add(id);
      saveBanco(); render();
    });
    document.querySelectorAll('[data-imgremove]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.imgremove, section=el.dataset.section;
      if(String(id).indexOf('cu_')===0){
        bankCustoms[section] = (bankCustoms[section]||[]).map(c=> c.id===id ? Object.assign({}, c, {img:undefined}) : c);
      } else {
        if(bankOverrides[id]) bankOverrides[id].img = undefined;
      }
      openEdits.add(id);
      saveBanco(); render();
    });
    document.querySelectorAll('[data-clearx]').forEach(el=>el.onclick=()=>{
      delete bankOverrides[el.dataset.clearx]; openEdits.delete(el.dataset.clearx); saveBanco(); render();
    });
    document.querySelectorAll('[data-delcustom]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.delcustom, section=el.dataset.section;
      bankCustoms[section] = (bankCustoms[section]||[]).filter(c=>c.id!==id);
      openEdits.delete(id); saveBanco(); render();
    });
    document.querySelectorAll('[data-addcustom]').forEach(el=>el.onclick=()=>{
      const section=el.dataset.addcustom;
      const id='cu_'+uid();
      if(!bankCustoms[section]) bankCustoms[section]=[];
      bankCustoms[section].push({id, n:'Nuevo ejercicio', mat:'', minFase:Number(state.fase), series:'', reps:'', carga:'', rpe:'', descanso:'', note:'', yt:''});
      openEdits.add(id); saveBanco(); render();
    });
    document.querySelectorAll('[data-addtosession]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.addtosession, section=el.dataset.section;
      const ex = poolForSection(section).find(x=>x.id===id);
      if(!ex) return;
      const e = effectiveEx(ex);
      sesion[section].push({rowId:uid(), n:e.n, series:e.series||'', reps:e.reps||'', carga:e.carga||'', rpe:e.rpe||'', descanso:e.descanso||'', notas:''});
      saveDraft();
      const original = el.textContent;
      el.textContent = '✓ Añadida a la sesión'; el.classList.add('added');
      setTimeout(()=>{ el.textContent = original; el.classList.remove('added'); }, 1400);
    });

    document.querySelectorAll('[data-mv]').forEach(el=>el.onclick=()=>{
      if(el.disabled) return;
      const section=el.dataset.section, rowId=el.dataset.row, dir=el.dataset.mv==='up'?-1:1;
      const arr=sesion[section]; const i=arr.findIndex(x=>x.rowId===rowId); const j=i+dir;
      if(i<0||j<0||j>=arr.length) return;
      const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
      saveDraft(); render();
    });
    document.querySelectorAll('[data-rmrow]').forEach(el=>el.onclick=()=>{
      const section=el.dataset.rmrow, rowId=el.dataset.row;
      sesion[section] = sesion[section].filter(x=>x.rowId!==rowId);
      saveDraft(); render();
    });
    document.querySelectorAll('[data-rmreg]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.rmreg;
      if(registro[state.jugId]) registro[state.jugId]=registro[state.jugId].filter(r=>r.id!==id);
      saveRegistro(); render();
    });

    // --- Bloque de test ---
    const btnAddTest = document.getElementById('btnAddTest');
    if(btnAddTest) btnAddTest.onclick = ()=>{
      sesion.test.push({rowId:uid(), test:'', lado:'Derecho', resultado:'', referencia:'', notas:''});
      saveDraft(); render();
    };
    document.querySelectorAll('[data-tmv]').forEach(el=>el.onclick=()=>{
      if(el.disabled) return;
      const rowId=el.dataset.row, dir=el.dataset.tmv==='up'?-1:1;
      const arr=sesion.test; const i=arr.findIndex(x=>x.rowId===rowId); const j=i+dir;
      if(i<0||j<0||j>=arr.length) return;
      const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
      saveDraft(); render();
    });
    document.querySelectorAll('[data-tmrmrow]').forEach(el=>el.onclick=()=>{
      sesion.test = sesion.test.filter(x=>x.rowId!==el.dataset.tmrmrow);
      saveDraft(); render();
    });

    // --- Imagen de la tarea de campo ---
    const campoUp = document.getElementById('campoimg-upload');
    if(campoUp) campoUp.onchange = async ()=>{
      const file = campoUp.files && campoUp.files[0];
      if(!file) return;
      try{ state.campoImagen = await resizeImageToDataURL(file, 1100, 0.85); }
      catch(e){ alert('No se pudo procesar la imagen.'); return; }
      saveDraft(); render();
    };
    const campoRm = document.getElementById('campoimg-remove');
    if(campoRm) campoRm.onclick = ()=>{ state.campoImagen = null; saveDraft(); render(); };

    // --- Registro y carga: selector de nº de sesión (el jugador viene del filtro global) ---
    const regSesSel = document.getElementById('regSesionSelect');
    if(regSesSel) regSesSel.onchange = ()=>{ state.regSesSel = regSesSel.value; render(); };

    // --- Seguimiento de lesionados ---
    const btnAddLes = document.getElementById('btnAddLesionado');
    if(btnAddLes) btnAddLes.onclick = ()=>{ openRosterForm(null); render(); };
    const btnSaveUrl = document.getElementById('btnSaveSheetUrl');
    if(btnSaveUrl) btnSaveUrl.onclick = ()=>{
      const el = document.getElementById('sheetCsvUrlInput');
      sheetSyncUrl = el ? el.value.trim() : '';
      stSet('rcf-readapt-sheeturl', sheetSyncUrl, true);
      sheetSyncMessage = ''; sheetSyncStatus = '';
      if(sheetSyncUrl) syncFromSheet(true); else render();
    };
    const btnSyncNow = document.getElementById('btnSyncNow');
    if(btnSyncNow) btnSyncNow.onclick = ()=> syncFromSheet(true);
    const btnFbConnect = document.getElementById('btnFirebaseConnect');
    if(btnFbConnect) btnFbConnect.onclick = ()=>{
      const cfgEl = document.getElementById('firebaseConfigInput');
      const colEl = document.getElementById('firebaseCollectionInput');
      firebaseConfigStr = cfgEl ? cfgEl.value.trim() : '';
      firebaseCollection = (colEl ? colEl.value.trim() : '') || 'lesionados_rcf';
      saveFirebaseConfig();
      if(firebaseConfigStr) connectFirebase(); else { disconnectFirebase(); render(); }
    };
    const btnFbDisconnect = document.getElementById('btnFirebaseDisconnect');
    if(btnFbDisconnect) btnFbDisconnect.onclick = ()=>{
      disconnectFirebase();
      firebaseConfigStr = '';
      saveFirebaseConfig();
      render();
    };
    const btnRosSave = document.getElementById('btnRosterSave');
    if(btnRosSave) btnRosSave.onclick = ()=>{
      const rec = readRosterForm();
      if(!rec.nombre && !rec.jugId){ alert('Indica al menos el nombre o el ID del jugador.'); return; }
      const isNew = !editingRosterId;
      if(editingRosterId){ lesionados = lesionados.map(l=> l.id===editingRosterId ? rec : l); }
      else { lesionados.push(rec); }
      if(isNew){ ensureSegSelection(); segSelectedIds.add(rec.id); }
      saveLesionados();
      rosterFormOpen=false; editingRosterId=null; rosterDraft=null;
      render();
    };
    const btnRosCancel = document.getElementById('btnRosterCancel');
    if(btnRosCancel) btnRosCancel.onclick = ()=>{ rosterFormOpen=false; editingRosterId=null; rosterDraft=null; render(); };
    const btnMasDatos = document.getElementById('btnToggleMasDatos');
    if(btnMasDatos) btnMasDatos.onclick = ()=>{ rosterDraft = readRosterForm(); rosterMoreOpen = !rosterMoreOpen; render(); };
    const chkArch = document.getElementById('chkShowArchived');
    if(chkArch) chkArch.onchange = ()=>{ showArchivedRoster = chkArch.checked; render(); };
    document.querySelectorAll('[data-segchk]').forEach(el=>el.onchange=()=>{
      ensureSegSelection();
      const id = el.dataset.segchk;
      if(el.checked) segSelectedIds.add(id); else segSelectedIds.delete(id);
      render();
    });
    const btnSegAll = document.getElementById('btnSegSelAll');
    if(btnSegAll) btnSegAll.onclick = ()=>{
      ensureSegSelection();
      const base = showArchivedRoster ? lesionados : lesionados.filter(l=>l.activo);
      base.forEach(l=>segSelectedIds.add(l.id));
      render();
    };
    const btnSegNone = document.getElementById('btnSegSelNone');
    if(btnSegNone) btnSegNone.onclick = ()=>{ ensureSegSelection(); segSelectedIds.clear(); render(); };
    document.querySelectorAll('[data-lesedit]').forEach(el=>el.onclick=()=>{
      const rec = lesionados.find(l=>l.id===el.dataset.lesedit);
      if(rec) openRosterForm(rec);
      render();
    });
    document.querySelectorAll('[data-lessession]').forEach(el=>el.onclick=()=>{
      const rec = lesionados.find(l=>l.id===el.dataset.lessession);
      if(!rec) return;
      const recs = (registro[rec.jugId]||[]).slice().sort((a,b)=> a.fecha<b.fecha?1:-1);
      if(!recs.length){ alert('Este jugador todavía no tiene sesiones registradas en «Registro y carga».'); return; }
      const last = recs[0];
      rec.nota = (last.objetivo||'') + (last.observaciones ? ' — '+last.observaciones : '');
      saveLesionados(); render();
    });
    document.querySelectorAll('[data-lesalta]').forEach(el=>el.onclick=()=>{
      const rec = lesionados.find(l=>l.id===el.dataset.lesalta);
      if(rec){ rec.activo = !rec.activo; saveLesionados(); render(); }
    });
    document.querySelectorAll('[data-lesdel]').forEach(el=>el.onclick=()=>{
      if(!confirm('¿Eliminar definitivamente este jugador del seguimiento de lesionados?')) return;
      const delId = el.dataset.lesdel;
      lesionados = lesionados.filter(l=>l.id!==delId);
      if(segSelectedIds) segSelectedIds.delete(delId);
      saveLesionados(); render();
    });
    const btnPrintSeg = document.getElementById('btnPrintSeguimiento');
    if(btnPrintSeg) btnPrintSeg.onclick = ()=>{ setTimeout(()=>window.print(), 30); };

    // --- Calendario semanal de citas ---
    const btnAddCita = document.getElementById('btnAddCita');
    if(btnAddCita) btnAddCita.onclick = ()=>{ openCitaForm(null, todayISO()); render(); };
    document.querySelectorAll('[data-addcitaday]').forEach(el=>el.onclick=()=>{
      openCitaForm(null, el.dataset.addcitaday); render();
    });
    document.querySelectorAll('[data-citaedit]').forEach(el=>el.onclick=()=>{
      const rec = citas.find(c=>c.id===el.dataset.citaedit);
      if(rec) openCitaForm(rec);
      render();
    });
    document.querySelectorAll('[data-citadel]').forEach(el=>el.onclick=()=>{
      if(!confirm('¿Eliminar esta cita?')) return;
      citas = citas.filter(c=>c.id!==el.dataset.citadel);
      saveCitas(); render();
    });
    const btnCitaSave = document.getElementById('btnCitaSave');
    if(btnCitaSave) btnCitaSave.onclick = ()=>{
      const rec = readCitaForm();
      if(!rec.fecha || !rec.hora){ alert('Indica al menos la fecha y la hora de la cita.'); return; }
      if(editingCitaId){ citas = citas.map(c=> c.id===editingCitaId ? rec : c); }
      else { citas.push(rec); }
      saveCitas();
      citaFormOpen=false; editingCitaId=null; citaDraft=null;
      render();
    };
    const btnCitaCancel = document.getElementById('btnCitaCancel');
    if(btnCitaCancel) btnCitaCancel.onclick = ()=>{ citaFormOpen=false; editingCitaId=null; citaDraft=null; render(); };
    const btnCitaPrev = document.getElementById('btnCitaPrevWeek');
    if(btnCitaPrev) btnCitaPrev.onclick = ()=>{ citasWeekStart = addDaysISO(citasWeekStart, -7); render(); };
    const btnCitaNext = document.getElementById('btnCitaNextWeek');
    if(btnCitaNext) btnCitaNext.onclick = ()=>{ citasWeekStart = addDaysISO(citasWeekStart, 7); render(); };
    const btnCitaToday = document.getElementById('btnCitaToday');
    if(btnCitaToday) btnCitaToday.onclick = ()=>{ citasWeekStart = mondayOf(todayISO()); render(); };
    const btnPrintCitas = document.getElementById('btnPrintCitas');
    if(btnPrintCitas) btnPrintCitas.onclick = ()=>{ setTimeout(()=>window.print(), 30); };

    // --- Memoria de sesiones ---
    document.querySelectorAll('[data-memfiltro]').forEach(el=>el.onclick=()=>{ memoriaFiltro = el.dataset.memfiltro; render(); });
    document.querySelectorAll('[data-memplayer]').forEach(el=>el.onclick=()=>{
      const jugId = el.dataset.memplayer;
      state.jugId = jugId;
      const rec = lesionados.find(l=>l.jugId===jugId);
      state.jugNombre = rec ? rec.nombre : '';
      state.jugCat = rec ? rec.categoria : '';
      saveDraft(); render();
    });
    document.querySelectorAll('[data-memdel]').forEach(el=>el.onclick=()=>{
      if(!confirm('¿Eliminar definitivamente esta sesión guardada?')) return;
      const id = el.dataset.memdel;
      if(registro[state.jugId]) registro[state.jugId] = registro[state.jugId].filter(r=>r.id!==id);
      saveRegistro(); render();
    });

    const btnG = document.getElementById('btnGuardarRegistro');
    if(btnG) btnG.onclick = ()=>{
      if(!state.jugId){ alert('Introduce el ID del jugador antes de guardar la sesión en el registro.'); return; }
      const dur = totalDuracion();
      const rpe = Number(state.rpeSesion)||0;
      const carga = dur*rpe;
      const rec = {id:uid(), fecha:state.fecha, numeroSesion:state.numeroSesion, fase:state.fase, objetivo:state.objetivo,
        duracion:dur, rpe:rpe, carga:carga, dolorEva:state.dolorEva, cumplimiento:state.cumplimiento, observaciones:state.observaciones,
        tests:(sesion.test||[]).map(t=>({test:t.test, lado:t.lado, resultado:t.resultado, referencia:t.referencia, notas:t.notas}))};
      if(!registro[state.jugId]) registro[state.jugId]=[];
      registro[state.jugId].push(rec);
      saveRegistro();
      jugadores[state.jugId] = {nombre:state.jugNombre, categoria:state.jugCat};
      saveJugadores();
      const flag = document.getElementById('guardarFlag');
      if(flag){ flag.style.opacity='1'; setTimeout(()=>{ flag.style.opacity='0'; }, 1800); }
    };
  }

  // ================= ENTRADA GLOBAL (sin re-render, para no perder el foco al escribir) =================
  function attachGlobalInput(){
    const app = document.getElementById('rcfApp');
    app.addEventListener('input', (e)=>{
      const t = e.target; if(!t.id) return;
      let m;
      if(t.id==='f-fecha'){ state.fecha=t.value; debounce('draft', saveDraft); return; }
      if(t.id==='f-numeroSesion'){ state.numeroSesion=t.value; debounce('draft', saveDraft); return; }
      if(t.id==='f-rpeObjetivo'){ state.rpeObjetivo=t.value; debounce('draft', saveDraft); return; }
      if(t.id==='f-objetivo'){ state.objetivo=t.value; debounce('draft', saveDraft); return; }
      if(t.id==='f-rpeSesion'){ state.rpeSesion=t.value; recomputeSummary(); debounce('draft', saveDraft); return; }
      if(t.id==='f-dolorEva'){ state.dolorEva=t.value; debounce('draft', saveDraft); return; }
      if(t.id==='f-observaciones'){ state.observaciones=t.value; debounce('draft', saveDraft); return; }
      if((m = t.id.match(/^blockmin-(.+)$/))){ state.blockMin[m[1]] = t.value.replace(/[^0-9.]/g,''); recomputeSummary(); debounce('draft', saveDraft); return; }
      if((m = t.id.match(/^ses-([a-z]+)-([^-]+)-(name|series|reps|carga|rpe|descanso|notas)$/))){
        const section=m[1], rowId=m[2], field=m[3];
        const item = (sesion[section]||[]).find(x=>x.rowId===rowId);
        if(item){ item[field==='name'?'n':field] = t.value; debounce('draft', saveDraft); }
        return;
      }
      if((m = t.id.match(/^lesnota-(.+)$/))){
        const rec = lesionados.find(l=>l.id===m[1]);
        if(rec){ rec.nota = t.value; debounce('lesionados', saveLesionados); }
        return;
      }
      if(t.id==='inf-fecha'){ informeMeta.fecha=t.value; debounce('lesionados', saveLesionados); return; }
      if(t.id==='inf-micro'){ informeMeta.micro=t.value; debounce('lesionados', saveLesionados); return; }
      if((m = t.id.match(/^seclabel-(.+)$/))){
        state.sectionLabels[m[1]] = t.value;
        debounce('draft', saveDraft);
        return;
      }
      if((m = t.id.match(/^test-([^-]+)-(nombre|resultado|referencia|notas)$/))){
        const rowId=m[1], field=m[2];
        const item = (sesion.test||[]).find(x=>x.rowId===rowId);
        if(item){
          item[field==='nombre'?'test':field] = t.value;
          if(field==='resultado' || field==='referencia'){
            const diff = computeTestDiff(item.resultado, item.referencia);
            const diffEl = document.getElementById('testdiff-'+rowId);
            if(diffEl) diffEl.textContent = diff===null ? '—' : fmtNum(diff,1)+'%';
            const interpEl = document.getElementById('testinterp-'+rowId);
            if(interpEl) interpEl.innerHTML = interpretTestDiff(diff);
          }
          debounce('draft', saveDraft);
        }
        return;
      }
      if((m = t.id.match(/^mem-([^-]+)-(fecha|numeroSesion|objetivo|duracion|rpe|dolorEva|observaciones)$/))){
        const recId=m[1], field=m[2];
        const rec = (registro[state.jugId]||[]).find(r=>r.id===recId);
        if(rec){
          rec[field] = t.value;
          if(field==='duracion' || field==='rpe'){
            const carga = (Number(rec.duracion)||0) * (Number(rec.rpe)||0);
            rec.carga = carga;
            const el = document.getElementById('memcarga-'+recId);
            if(el) el.textContent = fmtNum(carga);
          }
          debounce('registro', saveRegistro);
        }
        return;
      }
    });
    app.addEventListener('change', (e)=>{
      const t=e.target;
      if(t.id==='f-cumplimiento'){ state.cumplimiento=t.value; saveDraft(); }
      let m;
      if((m = t.id.match(/^test-([^-]+)-lado$/))){
        const item = (sesion.test||[]).find(x=>x.rowId===m[1]);
        if(item){ item.lado = t.value; saveDraft(); }
      }
      if((m = t.id.match(/^mem-([^-]+)-(fase|cumplimiento)$/))){
        const recId=m[1], field=m[2];
        const rec = (registro[state.jugId]||[]).find(r=>r.id===recId);
        if(rec){ rec[field] = field==='fase' ? Number(t.value) : t.value; saveRegistro(); }
      }
    });
  }

  // ================= BOTONES DE CABECERA (estáticos) =================
  document.getElementById('btnPrint').onclick = () => {
    state.activeTab = 'ficha'; render();
    setTimeout(()=>window.print(), 60);
  };
  document.getElementById('btnNueva').onclick = () => {
    if(!confirm('¿Empezar una sesión nueva? Se perderán los ejercicios añadidos a la sesión actual (el diseño de sesión y el registro de carga no se ven afectados).')) return;
    sesion = {calentamiento:[], gym:[], campo:[], vuelta:[]};
    state.objetivo=''; state.rpeSesion=''; state.dolorEva='0'; state.cumplimiento='Completo'; state.observaciones='';
    saveDraft(); render();
  };

  attachGlobalInput();
  loadAll();
})();
</script>
